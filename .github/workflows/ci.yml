name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Si se sube un commit nuevo a la misma rama, cancela la ejecucion anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Seguridad: que no se suban secretos ni certificados
  # ---------------------------------------------------------------
  seguridad:
    name: seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que no se suban secretos ni certificados
        run: |
          archivos=$(git ls-files | grep -E '\.(p12|pfx|jks|keystore|pem|key)$|(^|/)\.env$' || true)
          if [ -n "$archivos" ]; then
            echo "::error::Hay archivos sensibles en el repositorio:"
            echo "$archivos"
            exit 1
          fi
          echo "OK: no se encontraron secretos ni certificados."

  # ---------------------------------------------------------------
  # 2. Backend: compila y ejecuta las pruebas (Java 21 + Maven)
  # ---------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar proyecto backend
        id: detectar
        run: |
          if [ -f backend/pom.xml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Aun no existe backend/pom.xml: se omite este job."
          fi

      - name: Configurar Java 21
        if: steps.detectar.outputs.existe == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y probar
        if: steps.detectar.outputs.existe == 'true'
        run: mvn -B -f backend/pom.xml verify

  # ---------------------------------------------------------------
  # 3. Frontend: instala, revisa tipos, compila y prueba (Node 22)
  # ---------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detectar proyecto frontend
        id: detectar
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Aun no existe frontend/package.json: se omite este job."
          fi

      - name: Configurar Node 22
        if: steps.detectar.outputs.existe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        if: steps.detectar.outputs.existe == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Revisar codigo (lint)
        if: steps.detectar.outputs.existe == 'true'
        run: npm run lint --if-present

      - name: Pruebas
        if: steps.detectar.outputs.existe == 'true'
        run: npm test --if-present

      - name: Compilar
        if: steps.detectar.outputs.existe == 'true'
        run: npm run build --if-present

  # ---------------------------------------------------------------
  # 4. Docker: valida docker-compose y construye las imagenes
  # ---------------------------------------------------------------
  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Detectar docker-compose
        id: detectar
        run: |
          if [ -f docker-compose.yml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Aun no existe docker-compose.yml: se omite este job."
          fi

      - name: Validar docker-compose
        if: steps.detectar.outputs.existe == 'true'
        run: docker compose --env-file .env.example config -q

      - name: Construir imagenes
        if: steps.detectar.outputs.existe == 'true'
        run: docker compose --env-file .env.example build
