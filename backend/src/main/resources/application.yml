spring:
  application:
    name: pasantias-fq

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pasantias}
    username: ${DB_USER:pasantias_user}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # el esquema lo controla Flyway, nunca Hibernate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_ARCHIVO_MB:10}MB
      max-request-size: ${MAX_ARCHIVO_MB:10}MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

  jackson:
    time-zone: America/Guayaquil

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false            # que un fallo de correo no tumbe el healthcheck

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html

app:
  jwt:
    # En Docker este valor viene del archivo .env (JWT_SECRET). El valor por
    # defecto solo sirve para desarrollo local; nunca usarlo en produccion.
    secret: ${JWT_SECRET:solo-para-desarrollo-local-cambiar-0123456789abcdef}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
  storage:
    path: ${STORAGE_PATH:./data/archivos}
    max-archivo-mb: ${MAX_ARCHIVO_MB:10}
