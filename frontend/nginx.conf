# nginx sirve el build de React y reenvia /api al backend (Spring Boot).
# Asi el navegador habla con un unico origen y no hay problemas de CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Un poco mas que el limite de la aplicacion (10 MB por archivo)
    client_max_body_size 12m;

    # DNS interno de Docker: nginx arranca aunque el backend aun no este listo
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: se pueden cachear sin riesgo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicacion de una sola pagina: cualquier ruta devuelve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
